<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fraction to Decimal Chart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 20px;
    }
    h1 { text-align: center; }
    table {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ddd;
      padding: 1px;
      text-align: center;
    }
    th {
      background: #4f46e5;
      color: #fff;
    }
    svg.pie {
      width: 60px;
      height: 60px;
    }
    input { padding: 4px; }
  </style>
</head>
<body>
<table>
  <tr>
    <th>Pie</th>
    <th>Fraction</th>
    <th>Decimal</th>
  </tr>

  <!-- STATIC ROWS -->
  <tr>
    <td><svg class="pie" viewBox="0 0 100 100"><circle r="45" cx="50" cy="50" fill="#e5e7eb"/><path d="M50 50 L50 5 A45 45 0 0 1 95 50 Z" fill="#4f46e5"/></svg></td>
    <td>1/2</td><td>0.5</td>
  </tr>
  <tr>
    <td><svg class="pie" viewBox="0 0 100 100"><circle r="45" cx="50" cy="50" fill="#e5e7eb"/><path d="M50 50 L50 5 A45 45 0 0 1 80 86 Z" fill="#16a34a"/></svg></td>
    <td>1/3</td><td>0.333…</td>
  </tr>
  <tr>
    <td><svg class="pie" viewBox="0 0 100 100"><circle r="45" cx="50" cy="50" fill="#e5e7eb"/><path d="M50 50 L50 5 A45 45 0 0 1 95 50 Z" fill="#f59e0b"/></svg></td>
    <td>1/4</td><td>0.25</td>
  </tr>
  <tr>
    <td><svg class="pie" viewBox="0 0 100 100"><circle r="45" cx="50" cy="50" fill="#e5e7eb"/><path d="M50 50 L50 5 A45 45 0 1 1 5 50 Z" fill="#dc2626"/></svg></td>
    <td>3/4</td><td>0.75</td>
  </tr>
  <tr>
    <td><svg class="pie" viewBox="0 0 100 100"><circle r="45" cx="50" cy="50" fill="#e5e7eb"/><path d="M50 50 L50 5 A45 45 0 0 1 65 92 Z" fill="#0ea5e9"/></svg></td>
    <td>1/5</td><td>0.2</td>
  </tr>

  <!-- EDITABLE ROW -->
  <tr>
    <td>
      <svg id="editPie" class="pie" viewBox="0 0 100 100">
        <circle r="45" cx="50" cy="50" fill="#e5e7eb" />
        <path id="pieSlice" d="" fill="#9333ea" />
      </svg>
    </td>
    <td>
      <input id="num" type="number" placeholder="Numerator" style="width:80px" /> /
      <input id="den" type="number" placeholder="Denominator" style="width:90px" />
    </td>
    <td id="result">—</td>
  </tr>
</table>

<script>
  const num = document.getElementById('num');
  const den = document.getElementById('den');
  const result = document.getElementById('result');
  const slice = document.getElementById('pieSlice');

  function polar(cx, cy, r, angle) {
    const rad = (angle - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  function describePie(value) {
    const angle = value * 360;
    const end = polar(50, 50, 45, angle);
    const largeArc = angle > 180 ? 1 : 0;
    return `M50 50 L50 5 A45 45 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
  }

  function updateFraction() {
    const n = Number(num.value);
    const d = Number(den.value);

    if (n > 0 && d > 0 && n <= d) {
      const val = n / d;
      slice.setAttribute('d', describePie(val));
      result.textContent = val.toFixed(4);
    } else {
      slice.setAttribute('d', '');
      result.textContent = '—';
    }
  }

  num.addEventListener('input', updateFraction);
  den.addEventListener('input', updateFraction);
</script>

</body>
</html>
